name: CI

on:
  push:
    branches: [main, 'v[0-9]+.*']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      # The replay tests above run on the whole matrix and are expected to
      # pass on all of it: the fixtures were verified bit-identical on Node
      # 18, 20, 22 and 24 (V8 10.2 through 13.6). This gate only asks whether
      # the COMMITTED fixtures still equal a fresh regeneration, which is a
      # property of the source tree, not of the runtime — so it runs once.
      - run: pnpm run fixtures:current
        if: matrix.node-version == 22
